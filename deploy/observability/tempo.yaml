auth_enabled: false
server:
  http_listen_port: 3200
querier:
  max_concurrent_queries: 2
query_frontend:
  search:
    concurrent_jobs: 2
  trace_by_id:
    concurrent_shards: 2
distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
ingester:
  max_block_duration: 1m
compactor:
  compaction:
    block_retention: 4h
storage:
  trace:
    backend: local
    wal:
      path: /tmp/tempo/wal
    local:
      path: /tmp/tempo/blocks
