apiVersion: v1
kind: Namespace
metadata:
  name: scalens
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: scalens
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
        - name: postgres
          image: postgres:18.1-alpine
          args: ["-c", "shared_preload_libraries=pg_stat_statements", "-c", "shared_buffers=64MB", "-c", "max_connections=60", "-c", "max_parallel_workers_per_gather=0"]
          env:
            - {name: POSTGRES_USER, value: scalens}
            - {name: POSTGRES_PASSWORD, value: scalens}
            - {name: POSTGRES_DB, value: scalens}
          ports: [{containerPort: 5432}]
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: 500m, memory: 384Mi}
          readinessProbe:
            exec: {command: ["pg_isready", "-h", "127.0.0.1", "-U", "scalens"]}
            periodSeconds: 3
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql}
      volumes: [{name: data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: scalens}
spec:
  selector: {app: postgres}
  ports: [{port: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: payment-service, namespace: scalens}
spec:
  replicas: 1
  selector: {matchLabels: {app: payment-service}}
  template:
    metadata:
      labels: {app: payment-service}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "8081"}
    spec:
      containers:
        - name: payment-service
          image: scalens/payment:local
          imagePullPolicy: Never
          env:
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://tempo:4318"}
            - {name: OTEL_TRACES_SAMPLER_ARG, value: "0.1"}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
          ports: [{containerPort: 8081}]
          readinessProbe: {httpGet: {path: /readyz, port: 8081}, periodSeconds: 3}
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 250m, memory: 96Mi}
---
apiVersion: v1
kind: Service
metadata: {name: payment-service, namespace: scalens}
spec:
  selector: {app: payment-service}
  ports: [{port: 8081}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: order-service, namespace: scalens}
spec:
  replicas: 1
  selector: {matchLabels: {app: order-service}}
  template:
    metadata:
      labels: {app: order-service}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "8080"}
    spec:
      containers:
        - name: order-service
          image: scalens/order:local
          imagePullPolicy: Never
          env:
            - {name: DATABASE_URL, value: "postgres://scalens:scalens@postgres:5432/scalens?sslmode=disable"}
            - {name: PAYMENT_URL, value: "http://payment-service:8081"}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://tempo:4318"}
            - {name: OTEL_TRACES_SAMPLER_ARG, value: "0.1"}
            - {name: ORDER_SYNTHETIC_WORK, value: "0"}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
          ports: [{containerPort: 8080}]
          readinessProbe: {httpGet: {path: /readyz, port: 8080}, periodSeconds: 3}
          resources:
            requests: {cpu: 500m, memory: 48Mi}
            limits: {cpu: 500m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata: {name: order-service, namespace: scalens}
spec:
  type: NodePort
  selector: {app: order-service}
  ports: [{port: 8080, nodePort: 30080}]
